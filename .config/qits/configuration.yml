# The configuration keys qits-platform-maintenance reads.
#
# The deployer reads this file from the git host at the released tag and seeds it into
# qits-configuration before the deployment runs. qits-configuration's `DeclarationParser` is the one
# parser of this document; `keys` is the only top-level key.
#
# WHY THIS FILE EXISTS. qits-configuration flags a stored entry `orphaned` only when the application
# has a declaration that does not list the key. Without this file no entry of this application is
# flagged, so the dead ones cannot be found or removed. With it, every stored entry this file does
# not list is flagged `orphaned`, and a person can remove it with the configuration UI's Remove
# action. So this list must hold EVERY key the code still reads. A key missing here would invite
# someone to delete a value this service needs.
#
# NO KEY HAS A DEFAULT, on purpose. A declared default sits UNDER the stored entries, and on this
# platform the bootstrap stores all of these keys, so a default here would never be seen. Nothing
# observable changes when this file lands (configuration-yml.md, §7.5 step one). No key is a
# serviceAddress either: that type ignores stored values, and this change only lists keys. Moving to
# rendered addresses is later work.
#
# THE ONE OUTBOUND CLIENT, `qits` (epic qits-540 dossier, 'Plan (as of 2026-09-13)', C4). Its id,
# secret and idp address come from the deployer's `idp:client` resource alone
# (QITS_RESOURCE_IDP_URL/_CLIENT_ID/_CLIENT_SECRET), which is why none of the three is here: the
# deployer injects them from its resource registry, and they are never stored in qits-configuration.
# The OLD `projects` client's extras no longer feed it at all.
#
# DELIBERATELY NOT HERE, so they show as orphaned (plan C9, "maintenance 11"):
#   * QUARKUS_OIDC_CLIENT_GITHOST_* and QUARKUS_OIDC_CLIENT_CI_* (five each). There are no such
#     clients: `qits` mints for every peer, and those blocks are deleted.
#   * QUARKUS_OIDC_CLIENT_PROJECTS_* (all four, including CLIENT_ENABLED/CLIENT_ID/CREDENTIALS_SECRET
#     — the `qits` client reads QITS_RESOURCE_IDP_* alone now and nothing falls back to these). The
#     block stays in the shipped config, neutralised, only because the container still carries them.
#   * QITS_AUTH_MACHINE_AUDIENCE — the inbound audience is the platform's one, qits-platform, read by
#     the shared guard from its own shipped `qits.auth.machine.platform-audience`.
#   * QUARKUS_OIDC_AUTH_SERVER_URL and QITS_MAINTENANCE_MIRROR_MAVEN_URL. Every one of them names
#     a peer — qits-idp or qits-platform-mirror — whose address the shipped config DERIVES:
#     `http://${QITS_ENVIRONMENT:dev}-<application>:8080`, and QITS_ENVIRONMENT is injected into
#     every container by qits-deployments. It is a per-environment fact and this process already
#     knows which environment it is in, so an entry carrying it states nothing the container could
#     not work out — it is not a decision, just a spelling held in a second place.
#
#     They were bare until this release, and that was the platform plane: those two were one process
#     for the whole estate with one address estate-wide. The plane is deleted and they are ordinary
#     environment applications, so the address moved AND stopped being worth storing in the same
#     change.
#   * QITS_MAINTENANCE_MIRROR_NPM_URL, which is not even a key any more (qits-472): the npmjs
#     cache's address is derived in code (PeerTarget.NPM_MIRROR), so an entry for it is dead.

keys:
  # --- the peers this service calls ------------------------------------------------------------

  env.QITS_MAINTENANCE_TARGETS_PROJECTS_URL:
    type: string
    description: "Base url of qits-projects: the repository catalog, and where a finished bump opens its release request. No path."

  env.QITS_MAINTENANCE_TARGETS_GITHOST_URL:
    type: string
    description: "Base url of qits-githost, where each repository's manifests are read. No path."

  env.QITS_MAINTENANCE_TARGETS_CI_URL:
    type: string
    description: "Base url of the qits-ci that applies a bump. No path."

  env.QITS_MAINTENANCE_TARGETS_ARTIFACTS_URL:
    type: string
    description: "Base url of qits-artifacts, where SBOMs are read. No path: the /artifacts/sboms path is in the code."

  env.QITS_MAINTENANCE_REGISTRIES_MAVEN_URL:
    type: string
    description: "The hosted maven repository the latest internal maven versions are read from. Includes the repository path."

  env.QITS_MAINTENANCE_REGISTRIES_NPM_URL:
    type: string
    description: "The hosted npm repository the latest internal npm versions are read from. Includes the repository path."

  env.QITS_MAINTENANCE_REGISTRIES_OCI_URL:
    type: string
    description: "The OCI registry the latest internal image tags are read from. Includes the /v2 path."

  env.QITS_OBSERVABILITY_URL:
    type: string
    description: "Where this service's OTLP telemetry goes. Scheme, host and port, no path."

  # --- this service's own behaviour ------------------------------------------------------------

  env.QITS_MAINTENANCE_BUMP_INTERNAL_AUTO:
    type: boolean
    description: "Whether the schedule asks for internal dependency bumps by itself. The Bump button works either way."

  env.QITS_MAINTENANCE_ENVIRONMENT:
    type: string
    description: "Which environment's qits-ci applies a bump. Recorded on every bump row. Not this service's own tier: it has none."

  # --- inbound: how a machine token to this service is checked ---------------------------------

  env.QITS_AUTH_MACHINE_REQUIRED:
    type: boolean
    description: "The machine gate. Off, there is no OIDC tenant and no bearer is checked. On, a bearer is validated against the issuer below."

