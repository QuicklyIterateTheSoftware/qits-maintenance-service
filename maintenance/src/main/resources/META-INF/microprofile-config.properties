# Maintenance-context defaults, shipped from this library jar.
#
# Library jars ship defaults as META-INF/microprofile-config.properties (ordinal 100) — a jar's
# application.properties is ignored entirely — read by whichever app pulls the jar in, here the
# `service` module. Its own src/main/resources/application.properties sits at 250, `.env` at 295 and
# real environment variables at 300, so a deployment overrides any of these without a rebuild.
#
# This context owns its OWN named datasource + persistence unit + Flyway lineage: its own PostgreSQL
# database, never sharing another service's database or its migration history.
#
# WHERE THE DATABASE COMES FROM. `.config/qits/deployments.yml` carries `resources: postgresql:db`;
# qits-platform-deployments creates the role and the database (`qits_platform_maintenance`, the
# default derivation from the application name) on the tier's postgres before the successor
# container starts, and injects
#
#     QITS_RESOURCE_DB_URL / QITS_RESOURCE_DB_USERNAME / QITS_RESOURCE_DB_PASSWORD
#
# into it. Those three names are the platform's GENERIC resource contract — nothing about them is
# maintenance-specific, which is the point: the application maps them in its own shipped defaults
# and the deployer stays framework-agnostic.
#
# THE TRIPLE HAS NO DEFAULTS, AND THAT IS THE REFUSE-TO-BOOT STANCE. An unset variable leaves these
# expressions unresolvable, so the process dies at Flyway's migrate-at-start naming the missing
# variable, rather than opening some fallback store nobody meant. Opening the wrong database here
# would mean scanning the platform against one inventory and bumping branches from another.
quarkus.datasource.maintenance.db-kind=postgresql
quarkus.datasource.maintenance.jdbc.url=${QITS_RESOURCE_DB_URL}
quarkus.datasource.maintenance.username=${QITS_RESOURCE_DB_USERNAME}
quarkus.datasource.maintenance.password=${QITS_RESOURCE_DB_PASSWORD}

# THE POOL SURVIVES A POSTGRES CUTOVER, WHICH STOCK AGROAL DOES NOT. Replacing the tier's postgres
# severs every pooled connection; without validation the pool hands a dead one to the next caller
# long after the database is back, and 5s of acquisition is not enough for the successor to take the
# alias. Validate at borrow, and wait 15s before giving up.
#
# The driver is the third line of the platform's baseline. PatientPgDriver (qits-db-core) delegates
# to org.postgresql.Driver and, when the database is not there, keeps asking for up to 14s instead
# of failing at once; validate-on-borrow is what turns a dead pooled connection into the fresh
# creation attempt it can be patient about; the 15s acquisition timeout outlasts its deadline, so a
# caller that waits it out gets the database's real refusal rather than a generic pool message.
# `DatasourceBaselineTest` fails the build if a line goes missing.
quarkus.datasource.maintenance.jdbc.driver=eu.wohlben.qits.db.PatientPgDriver
quarkus.datasource.maintenance.jdbc.acquisition-timeout=15S
quarkus.datasource.maintenance.jdbc.validate-on-borrow=true

# A dedicated persistence unit bound to the maintenance datasource, owning only this module's
# entities. `packages` assigns entity->PU unambiguously; without it an entity in a service with no
# DEFAULT datasource has no unit to belong to and the boot fails naming neither.
quarkus.hibernate-orm.maintenance.datasource=maintenance
quarkus.hibernate-orm.maintenance.packages=eu.wohlben.qits.maintenance.entity

# Own Flyway lineage at a classpath location named after the context, so it can never mix with
# another service's db/migration if the two ever share a jar or a database.
quarkus.flyway.maintenance.migrate-at-start=true
quarkus.flyway.maintenance.locations=classpath:db/maintenance/migration

# --- where the peers are --------------------------------------------------------------------------
# TEN ADDRESSES, SIX SERVICES. The three registry keys and the two mirror keys carry a PATH as
# well as a host, because a registry is mounted under a prefix and the prefix names the repository
# row it serves: `/artifacts/maven/maven` is the hosted maven repository, `/artifacts/maven/central`
# is the Central pull-through. Putting the whole prefix in the key is what lets a deployment move a
# repository row without a code change.
#
# EVERY ONE OF THESE IS DERIVED, AND NONE OF THEM IS CONFIGURED. There is one environment and every
# wire alias is `<env>-<application>`, so each line expands QITS_ENVIRONMENT — injected into every
# container by qits-deployments — rather than naming a peer a deployment then has to correct. These
# four were bare because a platform-tier service was one process for the whole estate; that plane is
# deleted, so a bare alias now resolves nowhere and only a deployment override kept them working,
# which is exactly the shape this change exists to stop shipping.
# qits-projects is TWO things now: the catalog every scan reads, and THE RELEASE ASK — a bump that
# ends SUCCEEDED opens a release request on the branch it just pushed, at
# POST /projects/api/repositories/<repoId>/release-requests. That is the only address here this
# service WRITES to besides qits-ci's trigger, and it took no new key and no new credential: the
# route admits qits:system, which is what every call already carries.
qits.maintenance.targets.projects-url=http://${QITS_ENVIRONMENT:dev}-qits-projects:8080
qits.maintenance.targets.githost-url=http://${QITS_ENVIRONMENT:dev}-qits-githost:8080
qits.maintenance.targets.ci-url=http://${QITS_ENVIRONMENT:dev}-qits-ci:8080
# GET /pins asks qits-deployments which versions serve and which a rollback restores, and keeps
# what those releases declared (qits-1172). Derived like the three above.
qits.maintenance.targets.deployments-url=http://${QITS_ENVIRONMENT:dev}-qits-deployments:8080

# WHERE THE BILLS OF MATERIALS ARE. Another address and a fourth on qits-artifacts, and unlike the
# three registry keys below it carries NO path: those name a mount whose prefix is a repository row
# a deployment may move, while `/artifacts/sboms/...` is qits-artifacts' own API and its whole path
# belongs to the caller. See PeerTarget.ARTIFACTS_SBOM. The changelog listings a bump reads
# (`/artifacts/docs/docs/@changelog/<repository>`, epic qits-893) are the same service's own API and
# ride the same key: PeerTarget.ARTIFACTS_DOCS.
qits.maintenance.targets.artifacts-url=http://${QITS_ENVIRONMENT:dev}-qits-artifacts:8080

# THERE IS NO qits-configuration KEY ANY MORE. `targets.configuration-url` addressed
# GET /configuration/api/pins for the release trains' polled config-pin end; the trains are retired
# and the poll with them, so a deployment still setting QITS_MAINTENANCE_TARGETS_CONFIGURATION_URL is
# setting a key nothing reads. Remove it from the deployment's extras at the next edit of that file.

# THE SAME DERIVATION, FOR THE FOUR THAT CARRY A PATH. The host half expands QITS_ENVIRONMENT like
# the four targets above; only the prefix after it is a deployment's to move. The mirror line used
# to be bare because a platform-tier
# service was one process for the whole estate; that plane is deleted and the mirror is an ordinary
# environment application now. The registry lines were bare for no such reason at all — a bare
# `qits-artifacts` resolves nowhere on a tiered estate and only a deployment override kept them
# working, which is precisely the shape this change exists to stop shipping.
qits.maintenance.registries.maven-url=http://${QITS_ENVIRONMENT:dev}-qits-artifacts:8080/artifacts/maven/maven
qits.maintenance.registries.npm-url=http://${QITS_ENVIRONMENT:dev}-qits-artifacts:8080/artifacts/npm/npm
qits.maintenance.registries.oci-url=http://${QITS_ENVIRONMENT:dev}-qits-artifacts:8080/v2

qits.maintenance.mirror.maven-url=http://${QITS_ENVIRONMENT:dev}-qits-platform-mirror:8080/artifacts/maven/central
# THERE IS NO npm MIRROR KEY (qits-472). `mirror.npm-url` only ever held the same mirror host as
# the line above with `/npm/npmjs` for a path — nothing a deployment decides — so PeerTarget.NPM_MIRROR derives it from
# QITS_ENVIRONMENT in code, and a deployment still setting QITS_MAINTENANCE_MIRROR_NPM_URL is setting
# a key nothing reads. Remove it from the deployment's extras at the next edit of that file.

# HOW LONG ONE PEER CALL MAY TAKE. Generous because of ONE of them: qits-ci's trigger evaluates the
# event synchronously before answering — one git-host read per candidate repository — so it is not
# the round trip of a small JSON document. Everything else here answers in milliseconds and never
# comes near this.
qits.maintenance.call-timeout=PT60S

# --- what this platform publishes -----------------------------------------------------------------
# INTERNAL VS EXTERNAL IS A NAME RULE, and these three keys are the rule. It decides which registry
# is asked for a latest version and which of the two scan schedules refreshes it. A lookup instead
# of a rule would be a round trip per dependency on every scan, and a registry that was briefly down
# would reclassify half the inventory as external — which would then be asked of Maven Central,
# where `eu.wohlben.qits` does not exist.
#
# A maven group claims itself and everything under it: `eu.wohlben.qits` claims
# `eu.wohlben.qits.something` and does not claim `eu.wohlben.qitsy`.
qits.maintenance.internal.maven-groups=eu.wohlben.qits
qits.maintenance.internal.npm-scopes=@qits
qits.maintenance.internal.image-prefixes=qits/

# --- the schedules --------------------------------------------------------------------------------
# TWO CRONS, ONE PER SCOPE, and they are far apart on purpose. An external index is somebody else's
# and moves on nobody's schedule, so once a day is enough — and it is at 01:00, before
# qits-platform-orchestrator's 03:00 gc and qits-platform-mirror's 03:20 eviction, so the three
# never read the same postgres at the same minute.
#
# THE INTERNAL SCAN MOVED FROM EVERY SIX HOURS TO 00:30 DAILY, AND THE EVENTS ARE WHY. The bus
# listeners in service/…/bus/ are the fast path now: qits-ci's SoftwareRelease moves mt_latest
# forward within seconds of a package being published, and qits-githost's SCMPublishCommit re-reads
# one repository's manifests within seconds of a push to its main branch. A six-hourly poll over
# forty-nine repositories was the ONLY way either fact arrived; it is now the belt behind both, and a
# belt does not need to run four times a day.
#
# WHAT THE DAILY SCAN IS STILL FOR — three things no listener covers, each of them real:
#   * MISSED EVENTS. Durable consumption catches up from the log across a disconnect, but an event
#     the publisher never enqueued, or one this consumer settled as poison, is gone. A poll asks the
#     registry itself and needs nobody to have announced anything.
#   * CATALOG CHANGES. A repository added to qits-projects announces nothing to this service. Until
#     a scan reads the catalog it has no row, no pins and no groups — and no push event can create
#     one, because SCMPublishCommit is only acted on for a repository already known.
#   * A NEW CONSUMER STARTS AT THE HEAD OF THE LOG. The first deployment carrying these listeners
#     mints two watermarks and skips every release published before it; so does any future rename of
#     a consumerId. The scan is what fills the inventory in that window rather than leaving it empty
#     until the next release of every dependency.
#
# 00:30 rather than midnight or 01:00: half an hour clear of both, so the two scans of this service
# never overlap and neither shares a minute with the platform's other nightly chores.
#
# EVERY SCAN RE-READS EVERY MANIFEST, whatever its scope. That is one git-host call per repository
# plus a handful of blobs, and it is what keeps the inventory honest — the scope governs only which
# half of the REGISTRY lookups are refreshed.
qits.maintenance.scan.enabled=true
qits.maintenance.scan.internal.cron=0 30 0 * * ?
qits.maintenance.scan.external.cron=0 0 1 * * ?

# THE SBOM SWEEP, AND IT IS A NARROWER JOB THAN THE TWO ABOVE. It re-queues artifact rows still
# PENDING — a fetch that was queued and lost — and nothing else: MISSING and FAILED are terminal by
# design, because a 404 is the ordinary permanent answer for a release published before the SBOM
# route existed and a released version is immutable, so asking again asks about the same bytes.
#
# HOURLY, at :05, because the ordinary recovery is RestartRecovery at boot and this only covers a
# submission dropped while the process kept running. It is one indexed read and a return whenever
# nothing is pending, which is nearly always. `off` removes the trigger entirely — the scheduler's
# own value, the same one the story catalogue uses on the scan crons.
qits.maintenance.sbom.sweep-cron=0 5 * * * ?

# THE DAILY SBOM CHECK (qits-621 / qits-668, SbomCheckSchedule): every released software artifact
# still in qits-artifacts with no usable bill of materials — MISSING, FAILED, or PENDING for longer
# than the grace — reported in mt_sbom_check_run and served at GET /maintenance/api/sbom-check. No
# cut-off on age: the GC is what retires an old version, and the check follows it there.
#
# 02:15 daily, after the 02:00 internal bump: the check is a read of rows and listings that nothing
# at that hour is racing. `off` removes the trigger, as on every cron here.
qits.maintenance.sbom.check.cron=0 15 2 * * ?
# How long a PENDING row is a queued fetch rather than a finding. The ingest reads a document within
# seconds of the release, and the hourly sweep re-offers anything a restart dropped, so a day is long
# past any honest wait.
qits.maintenance.sbom.check.pending-grace=PT24H
# On: a run files one MAINTENANCE ticket per (project, ecosystem, name) missing a usable bill of
# materials, adds later versions as comments, and auto-closes the ticket (DROPPED) once every listed
# version is ingested or collected. Setting this false returns to report-only: a run still computes
# and stores its report, but calls NOTHING in qits-projects.
qits.maintenance.sbom.check.file-tickets=true

# THERE IS NO CONFIG-PIN SWEEP ANY MORE, and `qits.maintenance.train.sweep-cron` is gone with it.
# It ran every ten minutes to poll two release-train ends nothing announces — an IMAGE release
# becoming a runtime pin in qits-configuration, a daemon release climbing qits-ci's adoption ladder.
# Both were the OWNING service's fact, one click away, and re-polling two peers on a timer bought
# failure modes for them. The release trains are retired; the questions they answered are answered ad
# hoc out of this service's own tables, and those two ends are not among them. A deployment still
# setting QITS_MAINTENANCE_TRAIN_SWEEP_CRON is setting a key nothing reads.

# The zone both crons are read in. UTC is the platform's convention — every timestamp the UI shows
# is UTC — so "01:00" here is the same 01:00 an operator sees on a row.
qits.maintenance.time-zone=UTC

# --- bumping --------------------------------------------------------------------------------------
# `enabled` is whether a bump may be written AT ALL. False stops the dispatcher and every automation
# run that would write a commit, and the UI still shows everything pending, which is exactly what a
# platform wants while it watches the figures for a week.
qits.maintenance.bump.enabled=true

# GROUP BUMPS ARE RETIRED (qits-1133 R5). There is no maintenance/<group> branch, no 02:00 cron, no
# dispatch window and no group door any more; a repository's pins are written by the dependency-bump
# release-request automation inside the request they belong to. These keys are GONE and nothing reads
# them — a deployment still setting one is setting a key nothing claims, which MicroProfile does not
# fail on, so remove it at the next edit of the deployment's extras:
#   qits.maintenance.pre-run.upstream.enabled   (QITS_MAINTENANCE_PRE_RUN_UPSTREAM_ENABLED)
#   qits.maintenance.bump.internal.cron         (QITS_MAINTENANCE_BUMP_INTERNAL_CRON)
#   qits.maintenance.bump.external.auto         (QITS_MAINTENANCE_BUMP_EXTERNAL_AUTO)
#   qits.maintenance.bump.dispatch.gated        (QITS_MAINTENANCE_BUMP_DISPATCH_GATED)
#   qits.maintenance.bump.internal.window       (QITS_MAINTENANCE_BUMP_INTERNAL_WINDOW)

# THE DEPENDENCY-BUMP AUTOMATION (qits-1133): a release request's pins are moved inside the request,
# in its pre-run, before QA. Since the cutover it is the only thing that writes a pin, and since R5 it
# is the ONE KILL SWITCH of the whole bump path. Off (an emergency): the kind is not listed, planned
# or started, a row it opened before ends FRESH, the upstream hook re-plans nothing and the dispatcher
# opens no main-only request. Env: QITS_MAINTENANCE_AUTOMATIONS_DEPENDENCY_BUMP_ENABLED.
qits.maintenance.automations.dependency-bump.enabled=true

# THE DISPATCHER (bump/BumpDispatcher): every repository owed an internal bump that has NO open
# release request gets a MAIN-ONLY LOWEST request opened for it, whose pre-run writes the bump —
# withdrawn again when that pre-run finds nothing to write. A repository with an open request is held:
# that request's own pre-run carries the bump, and a library release re-plans it (automation/
# UpstreamReplan). `internal.auto` is the dispatcher's own switch; it ships TRUE because a platform
# that installs this service wants its own releases to travel.
#
# FREE SLOTS are read, not configured (qits-882): one GET of qits-ci's `/ci/api/runs/queue`, whose
# connected, unquarantined runners' slots, minus every running and queued run, minus our automation
# rows still REQUESTED, is how many requests may open this tick — from the bottom of the dependency
# chain, least-recently-dispatched first. An unreadable snapshot is busy; no runner at all is NO_SLOTS.
#
# `release-state-ttl` is how long qits-projects' answer about ONE repository's open requests, or ONE
# request's state, is reused; zero asks every tick. `refusal-ttl` is how long a repository whose
# request could not be opened (no catalog id, a refusal) is left alone before it is asked again.
#
# `quiet-hours` is what is left of the clock: comma-separated HH:MM-HH:MM ranges in
# `qits.maintenance.time-zone`, start inclusive, end exclusive, a range that wraps midnight allowed
# (`22:00-06:00` is one range). EMPTY BY DEFAULT — a platform that never asked for a quiet period does
# not silently have one. An unparseable entry is dropped with a WARN rather than obeyed — read as
# quiet it would stop every bump for ever.
qits.maintenance.bump.internal.auto=true
qits.maintenance.bump.dispatch.release-state-ttl=60s
qits.maintenance.bump.dispatch.refusal-ttl=6h
qits.maintenance.bump.dispatch.quiet-hours=

# HOW OFTEN AN UNFINISHED BUMP IS LOOKED AT. It does two jobs: it sends again a bump qits-ci
# answered 503 to, and it follows a running one's ci run to a terminal status. Fifteen seconds is
# far below the length of any pipeline and far above the cost of the read — a bump's whole lifetime
# is minutes, and the UI polls this service rather than qits-ci.
qits.maintenance.bump.poll-interval=15s

# WHICH ENVIRONMENT'S CI APPLIES A BUMP, recorded on every bump row. This service is platform tier
# and qits-ci is per environment; v1 talks to one, and the name here is what makes a second
# environment a config entry rather than a schema change. The default is the platform's standing
# environment name.
qits.maintenance.environment=dev

# --- outbound machine credentials -----------------------------------------------------------------
# ONE NAMED OIDC CLIENT, `qits`, carries the bearer this service presents to every peer (epic
# qits-540 dossier, 'Plan (as of 2026-09-13)', C4). Five separate clients used to exist because a
# token used to be cut FOR one service's own audience — qits-githost refused a token addressed to
# qits-ci. That rule is gone: every token now asks the ONE platform audience, `qits-platform`, and
# every receiver accepts it (C1, carried here by the maintenance bump train), so one client is
# enough for five peers.
#
# Its id, secret and idp address are this application's own qits-idp service client, and they come
# from the deployer and nowhere else. `.config/qits/deployments.yml` declares `resources: idp:client`,
# so qits-deployments provisions the client (id `<env>-qits-maintenance`, roles fixed in qits-idp
# code), stores its secret the way it stores a database password, and injects QITS_RESOURCE_IDP_URL,
# QITS_RESOURCE_IDP_CLIENT_ID and QITS_RESOURCE_IDP_CLIENT_SECRET into every container it starts
# (epic qits-540 dossier, 'Plan (as of 2026-09-13)', C3/C5). No configuration entry names any of the
# three, and the old `projects` client's extras no longer feed this one. Reference the raw env names
# inside `${…}`, never a dotted key: QITS_RESOURCE_* has no dotted twin anywhere.
#
# The defaults are what the deployer would inject on the dev estate: the idp's `<env>-qits-idp` alias
# on qits-net, and the client id `dev-qits-maintenance`. They only decide anything where no deployer
# started the process, and there the secret is empty, so a token request is refused rather than
# presenting somebody else's credential.
quarkus.oidc-client.qits.auth-server-url=${QITS_RESOURCE_IDP_URL:http://${QITS_ENVIRONMENT:dev}-qits-idp:8080/idp}
quarkus.oidc-client.qits.discovery-enabled=false
quarkus.oidc-client.qits.token-path=token
quarkus.oidc-client.qits.client-id=${QITS_RESOURCE_IDP_CLIENT_ID:dev-qits-maintenance}
quarkus.oidc-client.qits.credentials.secret=${QITS_RESOURCE_IDP_CLIENT_SECRET:}
quarkus.oidc-client.qits.grant.type=client
# One audience for every peer, the plan's ruling (epic qits-540 dossier, 'Plan (as of
# 2026-09-13)'): qits-platform. Not qits-projects, not qits-githost, not qits-ci — there is no
# per-service audience to ask for, and a receiver's own `quarkus.oidc.token.audience` is this one
# value fleet-wide (C1, qits-auth-core).
quarkus.oidc-client.qits.grant-options.client.audience=qits-platform
quarkus.oidc-client.qits.early-tokens-acquisition=false
# THE SWITCH IS READ TWICE ON PURPOSE — by the extension, deciding whether to build a client, and by
# PeerTokens, deciding whether to ask it for anything.
#
# ON WHEREVER THE DEPLOYER RUNS IT — every deployment has the resource, so there is no switch to
# flip. Off under %dev and %test, so a suite or a local run never dials a real idp.
#
# ONE TOGGLE NOW REACHES EVERY PEER. There is no per-peer arming left: on, qits-projects,
# qits-githost, qits-ci, qits-platform-artifacts and qits-platform-mirror are all called with a
# bearer; off, every one of them is called with the forward-auth pair alone. Each of those five
# accepts qits-platform, so turning it on is additive — a call gains a bearer, none loses one.
quarkus.oidc-client.qits.client-enabled=true
%dev.quarkus.oidc-client.qits.client-enabled=false
%test.quarkus.oidc-client.qits.client-enabled=false

# --- `projects`, neutralised: the container still carries its old extras --------------------------
# NOT A STUB FOR A CLIENT NOBODY CONFIGURES. PeerTokens mints through `qits` for every peer, and
# nothing reads this block — but the container still carries
# QUARKUS_OIDC_CLIENT_PROJECTS_{CLIENT_ID,CREDENTIALS_SECRET,CLIENT_ENABLED}, and **one such variable
# is enough to mint the map key**: the `projects` client EXISTS at runtime whatever this file leaves
# out, with `client-enabled` and `discovery-enabled` defaulting to TRUE. An enabled client is
# resolved during RUNTIME INIT, before the HTTP listener accepts — so an issuer that accepts the
# connection and never answers fails the boot on a hazard nothing here used to close. These three
# keys close it: `client-enabled=false` is what wins where no variable outranks this file (env is
# ordinal 300, this file 100), `discovery-enabled=false` is what removes the dial where the
# deployment's own `_CLIENT_ENABLED` DOES win, and `token-path` is what stops that same
# discovery-less client failing runtime init on a token endpoint it may no longer discover. It goes
# once no such variable reaches the container any more — the config GC deletes the retired entries
# and the deployer's extras file stops stating them (qits-375) — not before.
quarkus.oidc-client.projects.client-enabled=false
quarkus.oidc-client.projects.discovery-enabled=false
quarkus.oidc-client.projects.token-path=token

# --- `ci` and `githost`, neutralised the same way ---------------------------------------------------
# NOT STUBS FOR CLIENTS NOBODY CONFIGURES. The container carries
# QUARKUS_OIDC_CLIENT_{CI,GITHOST}_AUTH_SERVER_URL, and that alone is enough to mint each map key:
# `ci` and `githost` EXIST at runtime whatever this file leaves out, with `client-enabled` and
# `discovery-enabled` defaulting to TRUE. Left alone, each dials DISCOVERY at boot, during RUNTIME
# INIT, before the HTTP listener accepts — and that becomes unresolvable the moment the
# `dev-qits-platform-idp` alias it was pointed at is retired, which fails the boot rather than
# leaving an inert client. The same three keys as `projects` close it.
quarkus.oidc-client.ci.client-enabled=false
quarkus.oidc-client.ci.discovery-enabled=false
quarkus.oidc-client.ci.token-path=token
quarkus.oidc-client.githost.client-enabled=false
quarkus.oidc-client.githost.discovery-enabled=false
quarkus.oidc-client.githost.token-path=token

# THERE IS NO CLIENT FOR qits-platform-artifacts OR qits-platform-mirror. There was one each, back
# when a token was cut for one receiver's own audience; the one platform audience took the reason
# away and `qits` mints for all four peers. A deployment still setting QUARKUS_OIDC_CLIENT_ARTIFACTS_*
# or _MIRROR_* is setting keys nothing reads.

# THERE IS NO CLIENT FOR qits-configuration EITHER. There was one — audience qits-configuration, for
# the release trains' config-pin sweep — and it went with the trains: nothing here polls
# qits-configuration any more. A deployment still setting QUARKUS_OIDC_CLIENT_CONFIGURATION_* is
# setting keys nothing reads.

# THERE IS NO CLIENT FOR qits-workspaces. There was one — audience qits-workspaces, for the release
# door — and it went with the door: the release ask is a qits-projects route now, on the `qits`
# client above. A deployment still setting QUARKUS_OIDC_CLIENT_WORKSPACES_* is setting keys nothing
# reads; the named client no longer exists, so those variables define nothing rather than a stray
# token.
